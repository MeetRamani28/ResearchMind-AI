<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#3D3133"/>
  <!-- 3D Wireframe Octahedron Mesh -->
  <g stroke="#E85A4F" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer Edges -->
    <polygon points="32,8 54,28 32,56 10,28" stroke="#E27870" fill="#E85A4F" fill-opacity="0.15"/>
    <!-- Inner 3D Axis Wireframe -->
    <line x1="32" y1="8" x2="32" y2="56" stroke="#E85A4F"/>
    <line x1="10" y1="28" x2="54" y2="28" stroke="#E85A4F"/>
    <line x1="10" y1="28" x2="32" y2="38" stroke="#EAE7DC"/>
    <line x1="54" y1="28" x2="32" y2="38" stroke="#EAE7DC"/>
    <line x1="32" y1="8" x2="32" y2="38" stroke="#EAE7DC"/>
    <line x1="32" y1="56" x2="32" y2="38" stroke="#EAE7DC"/>
  </g>
  <!-- Glowing Vertices -->
  <circle cx="32" cy="8" r="3" fill="#EAE7DC"/>
  <circle cx="54" cy="28" r="3" fill="#E27870"/>
  <circle cx="32" cy="56" r="3" fill="#EAE7DC"/>
  <circle cx="10" cy="28" r="3" fill="#E27870"/>
  <circle cx="32" cy="38" r="3.5" fill="#FFFFFF"/>
</svg>